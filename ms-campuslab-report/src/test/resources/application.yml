spring:
  application:
    name: ms-campuslab-report
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

oidc:
  issuer-uri: https://login.microsoftonline.com/test-tenant/v2.0
  audience: api://test-audience

# Same RFC 5737 TEST-NET-1 reserved-address pattern as audit's own test config - a
# fast, deterministic failure for every test that doesn't override this with a real
# Testcontainers broker.
kafka:
  bootstrap-servers: 192.0.2.1:65535
