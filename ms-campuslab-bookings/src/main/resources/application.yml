spring:
  application:
    name: ms-campuslab-bookings
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
server:
  port: ${SERVER_PORT:8080}
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

oidc:
  issuer-uri: ${OIDC_ISSUER_URI}
  audience: ${OIDC_AUDIENCE}

catalog:
  service-url: ${CATALOG_SERVICE_URL}
  client:
    connect-timeout-ms: ${CATALOG_CLIENT_CONNECT_TIMEOUT_MS:2000}
    read-timeout-ms: ${CATALOG_CLIENT_READ_TIMEOUT_MS:5000}
