spring:
  application:
    name: ms-campuslab-bookings
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT}
    username: ${RABBITMQ_USER}
    password: ${RABBITMQ_PASSWORD}
    connection-timeout: 2000
server:
  port: ${SERVER_PORT:8080}
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
  health:
    rabbit:
      # Publishing is best-effort/fire-and-forget by design (messaging-notify.md §2.1) -
      # bookings' own liveness/readiness must not depend on RabbitMQ being reachable, the
      # same reasoning extended from the HTTP response to the health endpoint.
      enabled: false

oidc:
  issuer-uri: ${OIDC_ISSUER_URI}
  audience: ${OIDC_AUDIENCE}

kafka:
  bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}

catalog:
  service-url: ${CATALOG_SERVICE_URL}
  client:
    connect-timeout-ms: ${CATALOG_CLIENT_CONNECT_TIMEOUT_MS:2000}
    read-timeout-ms: ${CATALOG_CLIENT_READ_TIMEOUT_MS:5000}
