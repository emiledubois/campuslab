spring:
  application:
    name: ms-campuslab-bookings
  rabbitmq:
    # Same RFC 5737 TEST-NET-1 reserved-address pattern as catalog.service-url below -
    # a fast, deterministic connection failure (AC13's "RabbitMQ unreachable" case) for
    # every test that doesn't override this with a real Testcontainers broker, rather than
    # a hang against a real localhost:5672 that may or may not exist in a given CI/dev box.
    host: 192.0.2.1
    port: 65535
    username: guest
    password: guest
    connection-timeout: 300
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
  health:
    rabbit:
      enabled: false

oidc:
  issuer-uri: https://login.microsoftonline.com/test-tenant/v2.0
  audience: api://test-audience

# Default target for tests that never exercise the approval saga (most of them) - a
# reserved-for-documentation address (RFC 5737 TEST-NET-1) with nothing listening, so
# any test that DOES accidentally reach the saga branch fails fast and deterministically
# (503, "catalog unreachable") within the short timeout below, rather than hanging.
# Individual test classes that need a real approval flow override this via their own
# @DynamicPropertySource pointing at a StubCatalogServer instance.
catalog:
  service-url: http://192.0.2.1:65535
  client:
    connect-timeout-ms: 300
    read-timeout-ms: 300
