spring:
  application:
    name: ms-campuslab-kafka-admin
server:
  port: ${SERVER_PORT:8080}
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      # 'always', not 'never' (unauthenticated permitAll surface already, unchanged):
      # demo-readiness.md's TopologyHealthIndicator only matters if components.topology
      # is actually visible in the response Compose/AC3 inspect. Safe specifically because
      # this service never publishes a host port (infra/apps/compose.yml) - /actuator/health
      # is only reachable from other containers on campuslab-net, never from the host or
      # the internet (review iteration 1, finding 4).
      show-details: always

oidc:
  issuer-uri: ${OIDC_ISSUER_URI}
  audience: ${OIDC_AUDIENCE}

kafka:
  bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
  topic:
    replication-factor: ${KAFKA_TOPIC_REPLICATION_FACTOR:1}
