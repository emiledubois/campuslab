spring:
  application:
    name: ms-campuslab-bff
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

oidc:
  issuer-uri: https://issuer.example.test/realms/campuslab
  audience: campuslab-api
  roles-claim: realm_access.roles

cors:
  allowed-origins: http://localhost:5173
