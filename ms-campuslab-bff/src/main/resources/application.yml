spring:
  application:
    name: ms-campuslab-bff
server:
  port: ${SERVER_PORT:8080}
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

oidc:
  issuer-uri: ${OIDC_ISSUER_URI}
  audience: ${OIDC_AUDIENCE}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}

catalog:
  service-url: ${CATALOG_SERVICE_URL}

bookings:
  service-url: ${BOOKINGS_SERVICE_URL}

mq-admin:
  service-url: ${MQ_ADMIN_SERVICE_URL}

kafka-admin:
  service-url: ${KAFKA_ADMIN_SERVICE_URL}

audit:
  service-url: ${AUDIT_SERVICE_URL}

report:
  service-url: ${REPORT_SERVICE_URL}
