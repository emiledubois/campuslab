spring:
  application:
    name: ms-campuslab-notify
  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT}
    username: ${RABBITMQ_USER}
    password: ${RABBITMQ_PASSWORD}
    connection-timeout: 2000
    listener:
      simple:
        default-requeue-rejected: false
server:
  port: ${SERVER_PORT:8080}
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

notify:
  dedup:
    max-size: 10000
    expire-after-write-hours: 24
