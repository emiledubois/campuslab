networks:
  # Shared with infra/apps/compose.yml (§7 A05) so bookings/kafka-admin/audit there can
  # resolve `kafka` by hostname - see the matching comment in infra/mq/compose.yml. Created
  # once, out-of-band, via `docker network create campuslab-net` (see README.md).
  campuslab-net:
    external: true

services:
  # --- local profile: 1 Zookeeper node + 1 Kafka broker + Kafka UI ---
  zookeeper:
    image: confluentinc/cp-zookeeper:7.9.9
    profiles: ["local"]
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - campuslab-net
    healthcheck:
      test: ["CMD-SHELL", "echo srvr | nc -w 2 localhost 2181 | grep -q Mode"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  kafka:
    image: confluentinc/cp-kafka:7.9.9
    profiles: ["local"]
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    networks:
      - campuslab-net
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 15
    restart: unless-stopped

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    profiles: ["local"]
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME: campuslab
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
    ports:
      - "8082:8080"
    networks:
      - campuslab-net
    restart: unless-stopped

  # --- deploy profile: 3 Zookeeper nodes + 3 Kafka brokers, matching the case's cluster size ---
  zookeeper-1:
    image: confluentinc/cp-zookeeper:7.9.9
    profiles: ["deploy"]
    hostname: zookeeper-1
    environment:
      ZOOKEEPER_SERVER_ID: 1
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_INIT_LIMIT: 5
      ZOOKEEPER_SYNC_LIMIT: 2
      ZOOKEEPER_SERVERS: zookeeper-1:2888:3888;zookeeper-2:2888:3888;zookeeper-3:2888:3888
    networks:
      - campuslab-net
    healthcheck:
      test: ["CMD-SHELL", "echo srvr | nc -w 2 localhost 2181 | grep -q Mode"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  zookeeper-2:
    image: confluentinc/cp-zookeeper:7.9.9
    profiles: ["deploy"]
    hostname: zookeeper-2
    environment:
      ZOOKEEPER_SERVER_ID: 2
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_INIT_LIMIT: 5
      ZOOKEEPER_SYNC_LIMIT: 2
      ZOOKEEPER_SERVERS: zookeeper-1:2888:3888;zookeeper-2:2888:3888;zookeeper-3:2888:3888
    networks:
      - campuslab-net
    healthcheck:
      test: ["CMD-SHELL", "echo srvr | nc -w 2 localhost 2181 | grep -q Mode"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  zookeeper-3:
    image: confluentinc/cp-zookeeper:7.9.9
    profiles: ["deploy"]
    hostname: zookeeper-3
    environment:
      ZOOKEEPER_SERVER_ID: 3
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_INIT_LIMIT: 5
      ZOOKEEPER_SYNC_LIMIT: 2
      ZOOKEEPER_SERVERS: zookeeper-1:2888:3888;zookeeper-2:2888:3888;zookeeper-3:2888:3888
    networks:
      - campuslab-net
    healthcheck:
      test: ["CMD-SHELL", "echo srvr | nc -w 2 localhost 2181 | grep -q Mode"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Brokers del perfil deploy: dos listeners por broker.
  # - INTERNAL (0.0.0.0:29092, anunciado como kafka-N:29092): solo dentro de la red Docker
  #   campuslab-net. Lo usan la replicacion entre brokers, kafka-ui-deploy, el healthcheck y
  #   cualquier cliente en la misma red. Fijo, no configurable, nunca publicado al host.
  # - EXTERNAL (0.0.0.0:9092 en el contenedor, publicado en KAFKA_BROKER_N_ADVERTISED_PORT):
  #   para clientes de otro host (p. ej. ec2-apps). Anuncia
  #   KAFKA_BROKER_N_ADVERTISED_HOST:KAFKA_BROKER_N_ADVERTISED_PORT; el puerto de contenedor
  #   es siempre 9092 y la misma variable fija el lado host del mapeo y el puerto anunciado.
  # Un cliente nunca mezcla listeners (p. ej. kafka-1:9092 no es una configuracion soportada).
  # Con esto el perfil levanta tal cual: no se necesita ningun archivo override.
  # Ver docs/designs/kafka-compose-listeners.md.
  kafka-1:
    image: confluentinc/cp-kafka:7.9.9
    profiles: ["deploy"]
    hostname: kafka-1
    depends_on:
      zookeeper-1: { condition: service_healthy }
      zookeeper-2: { condition: service_healthy }
      zookeeper-3: { condition: service_healthy }
    ports:
      # Solo el listener EXTERNAL se publica. INTERNAL (29092) nunca se publica al host.
      - "${KAFKA_BROKER_1_ADVERTISED_PORT:-9092}:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper-1:2181,zookeeper-2:2181,zookeeper-3:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-1:29092,EXTERNAL://${KAFKA_BROKER_1_ADVERTISED_HOST:-localhost}:${KAFKA_BROKER_1_ADVERTISED_PORT:-9092}
      # Obligatorio: sin listener PLAINTEXT, Kafka no sabe por donde replicar y no arranca.
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    networks:
      - campuslab-net
    healthcheck:
      # INTERNAL: el broker responde y la metadata que devuelve es resoluble en la red.
      # EXTERNAL: el puerto 9092 del contenedor (el que se publica) esta escuchando.
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:29092 > /dev/null && nc -z -w 2 localhost 9092"]
      interval: 10s
      timeout: 10s
      retries: 15
    restart: unless-stopped

  kafka-2:
    image: confluentinc/cp-kafka:7.9.9
    profiles: ["deploy"]
    hostname: kafka-2
    depends_on:
      zookeeper-1: { condition: service_healthy }
      zookeeper-2: { condition: service_healthy }
      zookeeper-3: { condition: service_healthy }
    ports:
      # Solo el listener EXTERNAL se publica. INTERNAL (29092) nunca se publica al host.
      - "${KAFKA_BROKER_2_ADVERTISED_PORT:-9093}:9092"
    environment:
      KAFKA_BROKER_ID: 2
      KAFKA_ZOOKEEPER_CONNECT: zookeeper-1:2181,zookeeper-2:2181,zookeeper-3:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-2:29092,EXTERNAL://${KAFKA_BROKER_2_ADVERTISED_HOST:-localhost}:${KAFKA_BROKER_2_ADVERTISED_PORT:-9093}
      # Obligatorio: sin listener PLAINTEXT, Kafka no sabe por donde replicar y no arranca.
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    networks:
      - campuslab-net
    healthcheck:
      # INTERNAL: el broker responde y la metadata que devuelve es resoluble en la red.
      # EXTERNAL: el puerto 9092 del contenedor (el que se publica) esta escuchando.
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:29092 > /dev/null && nc -z -w 2 localhost 9092"]
      interval: 10s
      timeout: 10s
      retries: 15
    restart: unless-stopped

  kafka-3:
    image: confluentinc/cp-kafka:7.9.9
    profiles: ["deploy"]
    hostname: kafka-3
    depends_on:
      zookeeper-1: { condition: service_healthy }
      zookeeper-2: { condition: service_healthy }
      zookeeper-3: { condition: service_healthy }
    ports:
      # Solo el listener EXTERNAL se publica. INTERNAL (29092) nunca se publica al host.
      - "${KAFKA_BROKER_3_ADVERTISED_PORT:-9094}:9092"
    environment:
      KAFKA_BROKER_ID: 3
      KAFKA_ZOOKEEPER_CONNECT: zookeeper-1:2181,zookeeper-2:2181,zookeeper-3:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-3:29092,EXTERNAL://${KAFKA_BROKER_3_ADVERTISED_HOST:-localhost}:${KAFKA_BROKER_3_ADVERTISED_PORT:-9094}
      # Obligatorio: sin listener PLAINTEXT, Kafka no sabe por donde replicar y no arranca.
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    networks:
      - campuslab-net
    healthcheck:
      # INTERNAL: el broker responde y la metadata que devuelve es resoluble en la red.
      # EXTERNAL: el puerto 9092 del contenedor (el que se publica) esta escuchando.
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:29092 > /dev/null && nc -z -w 2 localhost 9092"]
      interval: 10s
      timeout: 10s
      retries: 15
    restart: unless-stopped

  kafka-ui-deploy:
    image: provectuslabs/kafka-ui:v0.7.2
    profiles: ["deploy"]
    container_name: kafka-ui-deploy
    depends_on:
      kafka-1: { condition: service_healthy }
      kafka-2: { condition: service_healthy }
      kafka-3: { condition: service_healthy }
    environment:
      KAFKA_CLUSTERS_0_NAME: campuslab
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka-1:29092,kafka-2:29092,kafka-3:29092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper-1:2181,zookeeper-2:2181,zookeeper-3:2181
    networks:
      - campuslab-net
    restart: unless-stopped
    # No host port published - management UIs must never be publicly reachable in deployment.
