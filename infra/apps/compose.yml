networks:
  # Shared across infra/apps/compose.yml and infra/mq/compose.yml (§7 A05): each
  # `docker compose -f ...` invocation otherwise gets its own auto-created bridge
  # network, so without this, mq-admin/notify/bookings here could never resolve
  # `rabbitmq` in the other file by hostname. Created once, out-of-band, via
  # `docker network create campuslab-net` (see README.md) - never by either compose
  # file itself, so neither `docker compose down` accidentally removes it out from
  # under the other file's still-running stack.
  campuslab-net:
    external: true

services:
  # --- Postgres, one container and one database per persisting service ---
  bookings-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${BOOKINGS_DB_NAME}
      POSTGRES_USER: ${BOOKINGS_DB_USER}
      POSTGRES_PASSWORD: ${BOOKINGS_DB_PASSWORD}
    volumes:
      - bookings-db-data:/var/lib/postgresql/data
    networks:
      - campuslab-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${BOOKINGS_DB_USER} -d ${BOOKINGS_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  catalog-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${CATALOG_DB_NAME}
      POSTGRES_USER: ${CATALOG_DB_USER}
      POSTGRES_PASSWORD: ${CATALOG_DB_PASSWORD}
    volumes:
      - catalog-db-data:/var/lib/postgresql/data
    networks:
      - campuslab-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${CATALOG_DB_USER} -d ${CATALOG_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  report-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${REPORT_DB_NAME}
      POSTGRES_USER: ${REPORT_DB_USER}
      POSTGRES_PASSWORD: ${REPORT_DB_PASSWORD}
    volumes:
      - report-db-data:/var/lib/postgresql/data
    networks:
      - campuslab-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${REPORT_DB_USER} -d ${REPORT_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  audit-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${AUDIT_DB_NAME}
      POSTGRES_USER: ${AUDIT_DB_USER}
      POSTGRES_PASSWORD: ${AUDIT_DB_PASSWORD}
    volumes:
      - audit-db-data:/var/lib/postgresql/data
    networks:
      - campuslab-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AUDIT_DB_USER} -d ${AUDIT_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # --- Spring Boot services. Only the BFF is published to the host - it is the
  # only public entry point per CLAUDE.md's non-negotiable call path. Every other
  # service is reachable only from other containers on this compose network. ---
  bff:
    build:
      context: ../../ms-campuslab-bff
      dockerfile: Dockerfile
    environment:
      SERVER_PORT: 8080
      OIDC_ISSUER_URI: ${OIDC_ISSUER_URI}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      CATALOG_SERVICE_URL: http://catalog:8080
      BOOKINGS_SERVICE_URL: http://bookings:8080
      MQ_ADMIN_SERVICE_URL: http://mq-admin:8080
      KAFKA_ADMIN_SERVICE_URL: http://kafka-admin:8080
      AUDIT_SERVICE_URL: http://audit:8080
      REPORT_SERVICE_URL: http://report:8080
    ports:
      - "8080:8080"
    depends_on:
      catalog:
        condition: service_healthy
      bookings:
        condition: service_healthy
      mq-admin:
        condition: service_healthy
      kafka-admin:
        condition: service_healthy
      audit:
        condition: service_healthy
      report:
        condition: service_healthy
    networks:
      - campuslab-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  bookings:
    build:
      context: ../../ms-campuslab-bookings
      dockerfile: Dockerfile
    environment:
      SERVER_PORT: 8080
      DB_URL: jdbc:postgresql://bookings-db:5432/${BOOKINGS_DB_NAME}
      DB_USERNAME: ${BOOKINGS_DB_USER}
      DB_PASSWORD: ${BOOKINGS_DB_PASSWORD}
      OIDC_ISSUER_URI: ${OIDC_ISSUER_URI}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE}
      CATALOG_SERVICE_URL: http://catalog:8080
      CATALOG_CLIENT_CONNECT_TIMEOUT_MS: ${CATALOG_CLIENT_CONNECT_TIMEOUT_MS:-2000}
      CATALOG_CLIENT_READ_TIMEOUT_MS: ${CATALOG_CLIENT_READ_TIMEOUT_MS:-5000}
      RABBITMQ_HOST: ${RABBITMQ_HOST:-rabbitmq}
      RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
    depends_on:
      bookings-db:
        condition: service_healthy
      mq-admin:
        condition: service_started
      kafka-admin:
        condition: service_started
    # rabbitmq / kafka entries removed (Part 6) - redundant with mq-admin/kafka-admin above,
    # which cannot report "healthy" until each broker is actually reachable and this
    # service's own topology is verified (see rationale above).
    # mq-admin/kafka-admin downgraded to service_started (Part 8) - their job for this service
    # is topology verification/reporting, not connection gatekeeping; RabbitPublisherConfig /
    # KafkaConsumerConfig / KafkaProducerConfig already tolerate an absent broker via their own
    # framework-level retry, so waiting on mq-admin/kafka-admin's own health here only exposes
    # this service to their widened start_period stall for no benefit.
    networks:
      - campuslab-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  catalog:
    build:
      context: ../../ms-campuslab-catalog
      dockerfile: Dockerfile
    environment:
      SERVER_PORT: 8080
      DB_URL: jdbc:postgresql://catalog-db:5432/${CATALOG_DB_NAME}
      DB_USERNAME: ${CATALOG_DB_USER}
      DB_PASSWORD: ${CATALOG_DB_PASSWORD}
      OIDC_ISSUER_URI: ${OIDC_ISSUER_URI}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE}
    depends_on:
      catalog-db:
        condition: service_healthy
    networks:
      - campuslab-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  notify:
    build:
      context: ../../ms-campuslab-notify
      dockerfile: Dockerfile
    environment:
      SERVER_PORT: 8080
      RABBITMQ_HOST: ${RABBITMQ_HOST:-rabbitmq}
      RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      NOTIFY_PREFETCH: ${NOTIFY_PREFETCH:-1}
      NOTIFY_CONCURRENCY_MIN: ${NOTIFY_CONCURRENCY_MIN:-3}
      NOTIFY_CONCURRENCY_MAX: ${NOTIFY_CONCURRENCY_MAX:-5}
      NOTIFY_RETRY_MAX_ATTEMPTS: ${NOTIFY_RETRY_MAX_ATTEMPTS:-4}
      NOTIFY_RETRY_INITIAL_BACKOFF_MS: ${NOTIFY_RETRY_INITIAL_BACKOFF_MS:-200}
      NOTIFY_RETRY_MULTIPLIER: ${NOTIFY_RETRY_MULTIPLIER:-2.0}
      NOTIFY_RETRY_MAX_BACKOFF_MS: ${NOTIFY_RETRY_MAX_BACKOFF_MS:-2000}
    depends_on:
      mq-admin:
        condition: service_started
    # rabbitmq entry removed (Part 6) - redundant with mq-admin above.
    # mq-admin downgraded to service_started (Part 8) - see bookings' identical note above.
    networks:
      - campuslab-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  report:
    build:
      context: ../../ms-campuslab-report
      dockerfile: Dockerfile
    environment:
      SERVER_PORT: 8080
      DB_URL: jdbc:postgresql://report-db:5432/${REPORT_DB_NAME}
      DB_USERNAME: ${REPORT_DB_USER}
      DB_PASSWORD: ${REPORT_DB_PASSWORD}
      OIDC_ISSUER_URI: ${OIDC_ISSUER_URI}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
    depends_on:
      report-db:
        condition: service_healthy
      kafka-admin:
        condition: service_started
    # kafka entry removed (Part 6) - redundant with kafka-admin above.
    # kafka-admin downgraded to service_started (Part 8) - see bookings' identical note above.
    networks:
      - campuslab-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  audit:
    build:
      context: ../../ms-campuslab-audit
      dockerfile: Dockerfile
    environment:
      SERVER_PORT: 8080
      DB_URL: jdbc:postgresql://audit-db:5432/${AUDIT_DB_NAME}
      DB_USERNAME: ${AUDIT_DB_USER}
      DB_PASSWORD: ${AUDIT_DB_PASSWORD}
      OIDC_ISSUER_URI: ${OIDC_ISSUER_URI}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
    depends_on:
      audit-db:
        condition: service_healthy
      kafka-admin:
        condition: service_started
    # kafka entry removed (Part 6) - redundant with kafka-admin above.
    # kafka-admin downgraded to service_started (Part 8) - see bookings' identical note above.
    networks:
      - campuslab-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  mq-admin:
    build:
      context: ../../ms-campuslab-mq-admin
      dockerfile: Dockerfile
    environment:
      SERVER_PORT: 8080
      RABBITMQ_HOST: ${RABBITMQ_HOST:-rabbitmq}
      RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      OIDC_ISSUER_URI: ${OIDC_ISSUER_URI}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE}
    # depends_on block removed entirely (Part 6) - its only prior entry was `rabbitmq`, its
    # sole upstream. Relies on TopologyHealthIndicator's own scheduled retry+latch instead.
    networks:
      - campuslab-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 240s
    restart: unless-stopped

  kafka-admin:
    build:
      context: ../../ms-campuslab-kafka-admin
      dockerfile: Dockerfile
    environment:
      SERVER_PORT: 8080
      OIDC_ISSUER_URI: ${OIDC_ISSUER_URI}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      KAFKA_TOPIC_REPLICATION_FACTOR: ${KAFKA_TOPIC_REPLICATION_FACTOR}
    # depends_on block removed entirely (Part 6) - its only prior entry was `kafka`, its sole
    # upstream. Relies on TopologyHealthIndicator's own scheduled retry+latch instead.
    networks:
      - campuslab-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 240s
    restart: unless-stopped

volumes:
  bookings-db-data:
  catalog-db-data:
  report-db-data:
  audit-db-data:
